# EKSPERIMEN LANJUTAN: XGBoost dengan grid diperluas (memperkecil kritik 'optimum di tepi grid') dan 3 seed uji akhir.
# MFCC (mean + std) + XGBoost (CPU hist), per sifat. Tanpa augmentasi (ablasi augmentasi menyusul).
name: xgb_mfcc_ext
seed: 42
test_seeds: [42, 43, 44]   # uji akhir 3 seed, sama dengan Wav2Vec2-BERT
n_jobs: 8

preprocess:            # sama untuk semua model
  sr: 16000
  trim_top_db: 40.0
  frame_ms: 25.0
  hop_ms: 10.0
  margin_ms: 50.0
  peak: 0.95
target_seconds: 1.9    # p99 durasi setelah trim di data latih = 1,870 s (reports/data_audit.md)

features:
  type: mfcc
  n_mfcc: 13
  n_fft: 512
  win_ms: 25.0
  hop_ms: 10.0
  n_mels: 40
  fmin: 20.0
  fmax: 8000.0
  delta_width: 9
  min_seconds: 0.1

model:
  type: xgb
  fixed:
    subsample: 0.8
    colsample_bytree: 0.8
  grid:
    n_estimators: [300, 600, 1000]
    max_depth: [4, 6, 8]
    learning_rate: [0.03, 0.05, 0.1]

augmentation: none

smoke:
  fraction: 0.1
  max_grid: 1
