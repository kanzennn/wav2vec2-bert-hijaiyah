# wav2vec 2.0 beku (facebook/wav2vec2-base, revisi 0b5b8e8): embedding 13 lapis dirata-rata di frame valid (cache),
# yang dilatih hanya kepala (bobot softmax antar-lapis + MLP 256). Per sifat, 3 seed. Tanpa augmentasi.
# Hiperparameter = rencana awal (belum di-tuning); jumlah epoch akhir dipilih dari early stopping di CV.
name: w2v_frozen
seed: 42               # dipakai untuk subset --smoke
seeds: [42, 43, 44]
n_jobs: 8

preprocess:            # sama untuk semua model
  sr: 16000
  trim_top_db: 40.0
  frame_ms: 25.0
  hop_ms: 10.0
  margin_ms: 50.0
  peak: 0.95
target_seconds: 1.9    # p99 durasi setelah trim di data latih = 1,870 s (reports/data_audit.md)

features:
  type: raw            # 16 kHz, dinormalisasi per rekaman (zero-mean, unit-variance di bagian valid)

model:
  type: w2v_frozen
  checkpoint: pretrained/facebook-wav2vec2-base
  params:
    hidden: 256
    dropout: 0.3

train:
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0001
  max_epochs: 60
  patience: 10
  amp: true

augmentation: none

smoke:
  fraction: 0.1
  max_epochs: 2
